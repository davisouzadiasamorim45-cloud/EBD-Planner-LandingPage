<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTA — Plataforma EBD</title>

<!-- ============================================================
     SEÇÃO CTA PREMIUM — shader WebGL (mesh gradient fluido)
     Autocontido: copie a <section>, o <style> e o <script>.
     Única dependência externa: a fonte Poppins (Google Fonts).
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --cta-bg:        #0d0820;
    --cta-deep:      #221140;
    --cta-text:      #ffffff;
    --cta-muted:     rgba(223,214,247,0.74);
    --cta-gold:      #d4af5e;
    --cta-gold-2:    #e7c878;
    --cta-gold-3:    #f0d490;
  }

  *{ box-sizing:border-box; }

  /* ---- Seção ---- */
  .cta{
    position:relative;
    width:100%;
    min-height:760px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:var(--cta-bg);
    font-family:'Poppins',system-ui,sans-serif;
  }
  .cta__canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block; z-index:0;
  }
  /* vinheta inferior para assentar o card */
  .cta__vignette{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(130% 100% at 50% 120%, rgba(8,5,20,0.7) 0%, rgba(8,5,20,0) 55%);
  }

  /* ---- Card de vidro ---- */
  .cta__card{
    position:relative; z-index:2;
    width:100%; max-width:920px; margin:0 24px;
    padding:68px 76px;
    text-align:center;
    border-radius:30px;
    background:linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.025) 100%);
    backdrop-filter:blur(16px) saturate(125%);
    -webkit-backdrop-filter:blur(16px) saturate(125%);
    border:1px solid rgba(255,255,255,0.10);
    box-shadow:0 40px 100px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.14);
    display:flex; flex-direction:column; align-items:center;
  }

  /* ---- Pílula / kicker ---- */
  .cta__pill{
    display:inline-flex; align-items:center; gap:9px;
    padding:8px 16px 8px 13px;
    border-radius:999px;
    border:1px solid rgba(212,175,94,0.32);
    background:rgba(212,175,94,0.10);
    color:var(--cta-gold-2);
    font-size:12.5px; font-weight:600; letter-spacing:2px; text-transform:uppercase;
  }
  .cta__pill-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--cta-gold-2);
    box-shadow:0 0 10px var(--cta-gold-2);
    animation:ctaPulse 2.4s ease-in-out infinite;
  }

  /* ---- Texto ---- */
  .cta__title{
    margin:28px 0 0;
    color:var(--cta-text);
    font-weight:700; font-size:60px; line-height:1.12; letter-spacing:-1px;
    max-width:760px; text-wrap:balance;
  }
  .cta__title .grad{
    background:linear-gradient(90deg,var(--cta-gold-2),var(--cta-gold));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:var(--cta-gold-2);
  }
  .cta__subtitle{
    margin:26px 0 0;
    color:var(--cta-muted);
    font-weight:400; font-size:21px; line-height:1.55; max-width:580px;
  }

  /* ---- Botão ---- */
  .cta__button{
    margin-top:40px;
    display:inline-flex; align-items:center; gap:12px;
    padding:20px 44px;
    border-radius:14px;
    text-decoration:none;
    color:var(--cta-deep);
    font-weight:600; font-size:18.5px; letter-spacing:.2px;
    background:linear-gradient(180deg,var(--cta-gold-3) 0%,var(--cta-gold) 55%,#c69a44 100%);
    box-shadow:0 1px 0 rgba(255,255,255,0.45) inset, 0 16px 38px rgba(198,154,68,0.40), 0 2px 8px rgba(0,0,0,0.30);
    transition:transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s ease;
  }
  .cta__button:hover{
    transform:translateY(-3px);
    box-shadow:0 1px 0 rgba(255,255,255,0.55) inset, 0 24px 52px rgba(198,154,68,0.52), 0 3px 10px rgba(0,0,0,0.32);
  }
  .cta__button .arrow{ font-size:19px; line-height:1; transform:translateY(-1px); }

  /* ---- Rodapé / tagline ---- */
  .cta__footer{
    margin-top:46px; width:100%; max-width:420px;
    display:flex; align-items:center; gap:18px;
  }
  .cta__rule{ flex:1; height:1px; }
  .cta__rule--l{ background:linear-gradient(90deg, rgba(212,175,94,0) 0%, rgba(212,175,94,0.35) 100%); }
  .cta__rule--r{ background:linear-gradient(90deg, rgba(212,175,94,0.35) 0%, rgba(212,175,94,0) 100%); }
  .cta__tagline{
    color:#c9a24b; font-weight:600; font-size:13px; letter-spacing:3.5px; white-space:nowrap;
  }

  /* ---- Animações ---- */
  @keyframes ctaPulse{ 0%,100%{ opacity:.5; transform:scale(1);} 50%{ opacity:1; transform:scale(1.35);} }

  /* ---- Responsivo ---- */
  @media (max-width:768px){
    .cta{ min-height:620px; }
    .cta__card{ padding:44px 26px; border-radius:24px; }
    .cta__title{ font-size:36px; letter-spacing:-.5px; }
    .cta__subtitle{ font-size:17px; }
    .cta__button{ padding:17px 30px; font-size:16px; width:100%; justify-content:center; }
    .cta__tagline{ font-size:11px; letter-spacing:2px; }
  }
  @media (prefers-reduced-motion:reduce){
    .cta__pill-dot{ animation:none; }
  }
</style>
</head>
<body style="margin:0;">

  <!-- =====================  MARKUP  ===================== -->
  <section class="cta">
    <canvas class="cta__canvas" data-cta-shader></canvas>
    <div class="cta__vignette"></div>

    <div class="cta__card">
      <div class="cta__pill">
        <span class="cta__pill-dot"></span>
        Plataforma de Planejamento da EBD
      </div>

      <h2 class="cta__title">
        Pronto para dar o <span class="grad">próximo passo</span> no planejamento da sua EBD?
      </h2>

      <p class="cta__subtitle">
        Precisa de ajustes? Marcamos uma reunião e personalizamos a plataforma para melhor atender a sua escola.
      </p>

      <a class="cta__button" href="#">
        Agendar demonstração com a liderança
        <span class="arrow">&rarr;</span>
      </a>

      <div class="cta__footer">
        <span class="cta__rule cta__rule--l"></span>
        <span class="cta__tagline">PLANEJE &middot; ENSINE &middot; TRANSFORME</span>
        <span class="cta__rule cta__rule--r"></span>
      </div>
    </div>
  </section>

  <!-- =====================  SHADER  ===================== -->
  <script>
  (function () {
    var canvas = document.querySelector('[data-cta-shader]');
    if (!canvas) return;

    /* -------- CONFIGURAÇÃO -------- *
     * style:     'Fluido' | 'Linhas' | 'Brilho'
     * intensity: 0 .. 1     (força do mesh)
     * gold:      0 .. 1.2   (brilho dourado)
     * speed:     0 .. 2.5   (velocidade do movimento)
     * ------------------------------- */
    var CONFIG = { style: 'Fluido', intensity: 0.7, gold: 0.65, speed: 1.0 };
    var MODE = { Fluido: 0, Linhas: 1, Brilho: 2 };

    var gl = canvas.getContext('webgl', { antialias: true });
    if (!gl) { canvas.style.background = 'linear-gradient(135deg,#1a0f38,#3a1c6b)'; return; }

    var VS = 'attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }';
    var FS = [
      'precision highp float;',
      'uniform vec2 u_res; uniform float u_time; uniform int u_mode;',
      'uniform float u_intensity; uniform float u_gold; uniform float u_speed;',
      'float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }',
      'vec3 blobColor(int i){',
      '  if(i==0) return vec3(0.357,0.165,0.640);',
      '  if(i==1) return vec3(0.227,0.118,0.560);',
      '  if(i==2) return vec3(0.470,0.180,0.560);',
      '  if(i==3) return vec3(0.180,0.165,0.560);',
      '  return vec3(0.560,0.300,0.480);',
      '}',
      'void main(){',
      '  float aspect = u_res.x/u_res.y;',
      '  vec2 uv = gl_FragCoord.xy/u_res.xy;',
      '  vec2 p = vec2(uv.x*aspect, uv.y);',
      '  float t = u_time*0.16*u_speed;',
      '  float soft = (u_mode==2) ? 0.95 : 0.62;',
      '  vec3 col = vec3(0.050,0.034,0.110);',
      '  for(int i=0;i<5;i++){',
      '    float fi = float(i);',
      '    float cx = 0.5 + 0.42*sin(t*(0.5+fi*0.13) + fi*1.7);',
      '    float cy = 0.5 + 0.40*cos(t*(0.43+fi*0.11) + fi*2.3);',
      '    vec2 c = vec2(cx*aspect, cy);',
      '    float d = distance(p, c);',
      '    float w = smoothstep(soft, 0.0, d); w = w*w;',
      '    col += blobColor(i) * w * (0.55 + u_intensity*0.7);',
      '  }',
      '  float gx = 0.5 + 0.30*sin(t*0.37);',
      '  float gy = 0.62 + 0.22*cos(t*0.29);',
      '  float gd = distance(p, vec2(gx*aspect, gy));',
      '  float gw = smoothstep(0.85, 0.0, gd); gw = pow(gw, 1.6);',
      '  col += vec3(0.85,0.69,0.38) * gw * 0.32 * u_gold * ((u_mode==2)?1.5:1.0);',
      '  if(u_mode==1){',
      '    for(int k=0;k<3;k++){',
      '      float fk = float(k);',
      '      float line = sin((p.x - p.y)*9.0 + t*1.4 + fk*2.1);',
      '      float band = smoothstep(0.93, 1.0, line);',
      '      col += vec3(0.85,0.70,0.42) * band * 0.05 * u_gold;',
      '    }',
      '  }',
      '  col = col/(col+0.85);',
      '  col = pow(col, vec3(0.85));',
      '  float vig = smoothstep(1.5,0.35,length((uv-0.5)*vec2(1.05,1.25)));',
      '  col *= mix(0.6,1.0,vig);',
      '  col += (hash(gl_FragCoord.xy + t)-0.5)*0.013;',
      '  gl_FragColor = vec4(col,1.0);',
      '}'
    ].join('\n');

    function compile(type, src){
      var s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.warn(gl.getShaderInfoLog(s));
      return s;
    }
    var prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog); gl.useProgram(prog);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    var U = {
      res: gl.getUniformLocation(prog, 'u_res'),
      time: gl.getUniformLocation(prog, 'u_time'),
      mode: gl.getUniformLocation(prog, 'u_mode'),
      intensity: gl.getUniformLocation(prog, 'u_intensity'),
      gold: gl.getUniformLocation(prog, 'u_gold'),
      speed: gl.getUniformLocation(prog, 'u_speed')
    };

    function resize(){
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
      var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h);
    }
    if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
    else window.addEventListener('resize', resize);
    resize();

    var start = performance.now();
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function frame(){
      var t = reduce ? 6.0 : (performance.now() - start) / 1000;
      gl.uniform2f(U.res, canvas.width, canvas.height);
      gl.uniform1f(U.time, t);
      gl.uniform1i(U.mode, MODE[CONFIG.style] || 0);
      gl.uniform1f(U.intensity, CONFIG.intensity);
      gl.uniform1f(U.gold, CONFIG.gold);
      gl.uniform1f(U.speed, CONFIG.speed);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (!reduce) requestAnimationFrame(frame);
    }
    frame();
  })();
  </script>

</body>
</html>
